name: docs-cleanup

# Delete a branch's documentation preview when the branch itself is deleted.
# (`on: delete` only fires for the copy of this file on the default branch.)
on:
  delete:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  remove-preview:
    if: github.event.ref_type == 'branch' && github.event.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove the preview directory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DELETED_BRANCH: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          slug="$(.github/scripts/branch-slug.sh "$DELETED_BRANCH")"
          echo "Removing /$slug/ (branch $DELETED_BRANCH was deleted)"
          .github/scripts/publish-docs.sh "$slug"

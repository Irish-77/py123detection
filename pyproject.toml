[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py123detection"
version = "0.1.0"
description = "123D toolkit for 3D multi-view object detection: export 123D datasets for the mmcv/mmdetection3d ecosystem, or train PETR and BEVFormer on them directly."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "py123d>=0.6.0",
    "numpy",
    "tqdm",
]

[project.optional-dependencies]
# --- mmcv export branch -----------------------------------------------------
# The exporter itself needs only the base dependencies: py123d and numpy.
# The nuScenes devkit. Needed to rebuild native dataset tokens (e.g. nuScenes sample tokens),
# and by py123detection.core.evaluation, which scores with the devkit's own algo.py.
nuscenes = ["nuscenes-devkit"]
# Only needed for `image_mode=extract` (writing embedded images back out to disk).
images = ["opencv-python"]

# --- torch branch -----------------------------------------------------------
# Everything `py123det-train` and `py123det-eval` import. Install it in its own environment:
# these pin nothing the exporter needs, and mmcv/mmdet3d pin versions that conflict with them.
# torch itself is deliberately unpinned to a build — install the wheel matching your CUDA first.
torch = [
    "torch>=2.1",
    "torchvision>=0.16",
    "lightning>=2.2",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "scipy>=1.10",
    "opencv-python",
    # py123det-eval scores with the devkit's own metric implementation.
    "nuscenes-devkit",
]

# --- rendering ---------------------------------------------------------------
# `py123det-viz` and py123detection.torch.visualize. Kept out of `torch` so a training environment
# does not pull a plotting stack; cv2 already comes with `torch` and `images`.
viz = [
    # 3.8 is where matplotlib gained NumPy 2 support. Anything older raises on `np.Inf` inside
    # its own title positioning, which this project found the hard way: envs/modern pairs
    # matplotlib 3.5.3 with numpy 2.4.6 and cannot save a titled figure.
    "matplotlib>=3.8",
    "opencv-python",
]

dev = ["pytest", "ruff"]
# Only needed to build the documentation site (see docs/development.md).
docs = [
    "sphinx>=8",
    "furo",
    "myst-parser>=2",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx-argparse",
    "sphinxcontrib-mermaid",
    "sphinx-autobuild",
]

[project.scripts]
# mmcv export branch: base install is enough.
py123det-export-mmcv = "py123detection.mmcv.export.cli:main"
# torch branch: both need the `torch` extra.
py123det-train = "py123detection.torch.train:main"
py123det-eval = "py123detection.torch.evaluate:main"
# rendering: needs the `viz` extra as well.
py123det-viz = "py123detection.torch.visualize.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
py123detection = ["py.typed"]
"py123detection.torch" = ["conf/**/*.yaml"]

[tool.ruff]
line-length = 120
lint.select = ["E", "F", "I"]
lint.ignore = ["E501", "E741"]
exclude = ["__init__.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests that need converted 123D data on disk (deselected by default)",
    # The export side genuinely needs neither torch nor hydra, so its suite has to be runnable
    # without them -- `-m "not torch"` is how you ask for exactly that. The modules below also keep
    # an importorskip, so a local run without the extra skips rather than failing to collect; the
    # marker is what makes the exclusion deliberate instead of accidental.
    "torch: needs the torch extra (torch, lightning, hydra, nuscenes-devkit)",
]
addopts = ["-m", "not integration"]

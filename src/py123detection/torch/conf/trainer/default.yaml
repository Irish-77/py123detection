# @package trainer
max_epochs: 24
precision: 16-mixed
devices: 1
strategy: auto
accumulate_grad_batches: 1
# PETR's published clip value. The Hungarian matcher makes early gradients spiky.
gradient_clip_val: 35.0
warmup_steps: 500
limit_train_batches: 1.0
limit_val_batches: 1.0
log_every_n_steps: 50

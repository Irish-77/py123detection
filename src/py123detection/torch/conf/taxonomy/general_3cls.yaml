# @package taxonomy
# Vehicle, pedestrian, cyclist — the Waymo-style grouping.
#
# Resolved by py123detection.core.taxonomy.get_taxonomy, which owns the class list, the label
# mapping from each dataset, and any rider-merging rules.
name: general_3cls
# Short form, used in run and directory names.
label: general3

# How far out each class is scored, in metres. The devkit has no radius for a class
# it does not know, and guessing one silently decides how much of the scene counts.
class_range:
  vehicle: 50.0
  pedestrian: 40.0
  cyclist: 40.0
